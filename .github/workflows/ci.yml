name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Plugin tests & hygiene (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Syntax check & manifest validation
        run: |
          node --check hooks/on-stop.mjs
          node --check hooks/speak-worker.mjs
          node -e "const fs=require('fs'); for (const f of ['plugin.json','hooks.json','config.example.json']) { JSON.parse(fs.readFileSync(f,'utf8')); } console.log('JSON_OK')"

      - name: Run unit tests
        run: node --no-warnings --test tests/test-notifier.mjs

      - name: CLI Stop hook dry-run
        shell: bash
        run: |
          OUT=$(printf '%s' '{"conversationId":"ci-dry-run","terminationReason":"USER_CANCELED","fullyIdle":true}' | node ./hooks/on-stop.mjs)
          echo "HOOK_OUT=$OUT"
          test "$OUT" = '{"decision":"allow"}'
